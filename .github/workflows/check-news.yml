name: Check for new papers and grants

on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays ~9am New York
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed run: record everything found now as known, draft nothing"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Look for new items
        run: python scripts/check_news.py ${{ inputs.seed && '--seed' || '' }}
      - name: Open a pull request for review
        uses: peter-evans/create-pull-request@v8
        with:
          branch: news-bot/updates
          delete-branch: true
          title: "Publications bot: new items to review"
          commit-message: "Publications bot: draft new entries"
          body-path: .newsbot_pr_body.md
          add-paths: |
            publications.qmd
            data/*.txt
